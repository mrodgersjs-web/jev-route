name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-bench:
    name: test and bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - run: ./target/release/jev-route validate --fixture fixtures/benchmark.json

  wasm:
    name: wasm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build artifact
        working-directory: wasm
        run: ./build.sh
      - name: report artifact size (functional check follows)
        run: ls -l wasm/js/jev_route_wasm.wasm
      - name: js contract tests against the freshly built artifact
        working-directory: wasm
        run: npm test
